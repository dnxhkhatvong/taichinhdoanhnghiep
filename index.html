<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Quản trị tài chính Khát Vọng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: web admin – menu trái thu gọn theo nhóm, thanh xanh trên cùng (tháng báo cáo, tài khoản, xuất), nội dung nền xám với thẻ trắng viền xanh; nhập liệu bằng form cỡ lớn, bảng chỉ để xem. */
:root{
  --bg:#ecf0f5; --card:#ffffff; --fg:#2b3a42; --muted:#607380; --line:#dde4ea; --row-alt:#f6f8fa;
  --accent:#3c8dbc; --accent-ink:#ffffff; --accent-soft:#e3f0f8;
  --side:#222d32; --side-sub:#2c3b41; --side-fg:#b8c7ce; --side-hl:#ecf0f5; --side-hl-fg:#222d32; --side-line:#1a2226;
  --in-bg:#fffdf3; --calc-bg:#eef5fb; --input-line:#c9d3da;
  --good:#1e8449; --good-bg:#e0f3e8; --warn:#8a5d00; --warn-bg:#fdf1d3; --bad:#c0392b; --bad-bg:#fbe3e0; --neutral-bg:#e8edf1;
  --edit:#e08e0b; --del:#d0402f; --c-rev:#3c8dbc; --c-exp:#e08a2e; --shadow:0 1px 2px rgba(20,40,60,.08);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181c; --card:#1a2328; --fg:#dbe4e9; --muted:#93a5af; --line:#2a363d; --row-alt:#1e282e;
  --accent:#2e6f94; --accent-ink:#ffffff; --accent-soft:#1d3342;
  --side:#0e1417; --side-sub:#161f24; --side-fg:#a5b6be; --side-hl:#2b3a42; --side-hl-fg:#ffffff; --side-line:#0a0f12;
  --in-bg:#22261a; --calc-bg:#17262e; --input-line:#3a4a53;
  --good:#58c283; --good-bg:#17301f; --warn:#e6b84a; --warn-bg:#352c12; --bad:#ef7d70; --bad-bg:#3a1c19; --neutral-bg:#26323a;
  --edit:#c98410; --del:#c9402f; --c-rev:#4aa3d4; --c-exp:#e59a47; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181c; --card:#1a2328; --fg:#dbe4e9; --muted:#93a5af; --line:#2a363d; --row-alt:#1e282e;
  --accent:#2e6f94; --accent-ink:#ffffff; --accent-soft:#1d3342;
  --side:#0e1417; --side-sub:#161f24; --side-fg:#a5b6be; --side-hl:#2b3a42; --side-hl-fg:#ffffff; --side-line:#0a0f12;
  --in-bg:#22261a; --calc-bg:#17262e; --input-line:#3a4a53;
  --good:#58c283; --good-bg:#17301f; --warn:#e6b84a; --warn-bg:#352c12; --bad:#ef7d70; --bad-bg:#3a1c19; --neutral-bg:#26323a;
  --edit:#c98410; --del:#c9402f; --c-rev:#4aa3d4; --c-exp:#e59a47; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.ic{width:1.15em;height:1.15em;flex:none}

.app{display:flex;flex-direction:column;height:100%}
.top{flex:none;height:54px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{width:240px;flex:none;height:100%;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.12);font-weight:700;letter-spacing:.04em}
.brand .mk{width:32px;height:32px;border-radius:7px;background:#fff;color:#2b6f95;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:0}
.iconbtn{background:none;border:0;color:inherit;width:42px;height:42px;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.15)}
.grow{flex:1}
.mon{display:flex;align-items:center;gap:8px;font-size:13px}
.mon input{background:rgba(255,255,255,.95);color:#22323a;border:0;border-radius:4px;padding:5px 8px;height:36px;min-width:0}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:4px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);color:inherit;cursor:pointer;font-size:13px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.gsst{font-size:12px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.22);white-space:nowrap}
.gsst.ok{background:#2f9e62}.gsst.err{background:#c0392b}

.shell{flex:1;display:flex;min-height:0;position:relative}
.side{width:240px;flex:none;background:var(--side);color:var(--side-fg);overflow-y:auto;padding-left:env(safe-area-inset-left,0px);transition:margin .2s}
.collapsed .side{margin-left:-240px}
.who{display:flex;align-items:center;gap:10px;padding:14px 14px 12px}
.who .av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who b{display:block;color:#fff;font-size:13px}
.who small{display:flex;align-items:center;gap:6px;font-size:11px}
.who small i{width:7px;height:7px;border-radius:50%;background:#3fb56b}
.navlabel{padding:8px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--side-line);color:#7d939d}
.grp>button{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:none;border:0;border-left:3px solid transparent;color:var(--side-fg);cursor:pointer;text-align:left;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.grp>button .chev{margin-left:auto;transition:transform .15s}
.grp.open>button .chev{transform:rotate(-90deg)}
.grp.hasact>button{background:var(--side-hl);color:var(--side-hl-fg);border-left-color:var(--accent)}
.sub{display:none;background:var(--side-sub);padding:4px 0}
.grp.open .sub{display:block}
.sub a{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 22px;color:var(--side-fg);text-decoration:none;font-size:13.5px;min-height:40px}
.sub a::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid currentColor;flex:none;opacity:.8}
.sub a:hover{color:#fff}
.sub a.act{color:#fff;font-weight:600}
.sub a.act::before{background:var(--accent);border-color:var(--accent);opacity:1}

.main{flex:1;min-width:0;overflow:auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.head h1{margin:0;font-size:21px;font-weight:600;text-wrap:balance}
.crumbs{font-size:12px;color:var(--muted)}
.crumbs span+span::before{content:"›";margin:0 6px}
.lead{margin:0 0 14px;color:var(--muted);font-size:13.5px;max-width:82ch}
.note{font-size:12.5px;color:var(--muted);padding:0 14px 14px;margin:0;max-width:90ch}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:9px 12px;margin-bottom:14px;font-size:13px}
.card{background:var(--card);border-top:3px solid var(--accent);border-radius:3px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card h2{margin:0;padding:12px 14px;font-size:14.5px;font-weight:600;border-bottom:1px solid var(--line)}
.card .pad{padding:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;align-items:center}
.tools select,.tools input{height:40px;border:1px solid var(--input-line);background:var(--card);border-radius:4px;padding:0 10px;min-width:0}
.tools input[type=search]{flex:1 1 200px;max-width:340px}
.push{margin-left:auto}
.btn{min-height:40px;padding:0 16px;border:0;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;background:var(--neutral-bg);text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--del);color:#fff}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
#bulk{margin:0 14px 10px;padding:8px 12px;border-radius:3px;background:var(--bad-bg);color:var(--bad);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.tw{overflow-x:auto;padding:0 14px 14px}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em;padding:10px 8px;border:1px solid rgba(255,255,255,.25);text-align:center;white-space:nowrap}
.tbl td{padding:8px;border:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:nth-child(even){background:var(--row-alt)}
.tbl tbody tr.rw{cursor:pointer}
.tbl tbody tr.rw:hover{background:var(--accent-soft)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.calc{background:var(--calc-bg)}
.tbl td.neg{color:var(--bad)}
.tbl td.nw{white-space:nowrap}
.tbl td.ck,.tbl th.ck{width:40px;text-align:center}
.tbl input[type=checkbox],.chk input{width:20px;height:20px;accent-color:var(--accent)}
.tbl td.stt{width:52px;text-align:center;color:var(--muted);font-size:12px}
.tbl td.act{white-space:nowrap;text-align:center;width:96px}
.ib{width:36px;height:34px;border:0;border-radius:4px;color:#fff;cursor:pointer;display:inline-grid;place-items:center;margin:0 1px;font-size:12px;vertical-align:middle}
.ib.edit{background:var(--edit)} .ib.view{background:var(--muted)} .ib.del{background:var(--del)}
.ib.del.armed{width:auto;padding:0 10px}
.tbl tfoot td{font-weight:700;background:var(--accent-soft);color:var(--fg);padding:9px 8px}
.tbl tfoot td.n{text-align:right}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--neutral-bg);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.who-ed{font-size:11.5px;color:var(--muted);white-space:nowrap}
.lk{font-size:11px;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:0 14px 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}

.rtbl{border-collapse:collapse;width:100%;font-size:14px}
.rtbl th{background:var(--accent);color:var(--accent-ink);padding:10px 12px;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.rtbl th.n{text-align:right}
.rtbl td{padding:10px 12px;border-bottom:1px solid var(--line)}
.rtbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rtbl td.neg{color:var(--bad)}
.rtbl tr.b td{font-weight:700;background:var(--calc-bg)}
.rtbl tfoot td{font-weight:700;background:var(--accent-soft)}
.rtbl .rin{height:38px;width:150px;max-width:100%;border:1px solid var(--input-line);background:var(--in-bg);border-radius:4px;padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.pctin{display:inline-flex;align-items:center;gap:4px}
.pctin .rin{width:90px}
.meter{display:inline-block;vertical-align:middle;width:90px;height:8px;border-radius:99px;background:var(--neutral-bg);margin-right:8px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter span.over{background:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:16px}
.kpi{display:flex;background:var(--card);border-radius:3px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.kpi .ico{width:60px;flex:none;display:grid;place-items:center;color:#fff;font-size:24px}
.kpi .tx{padding:10px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v.neg{color:var(--bad)}
.kpi .s{font-size:12px;color:var(--muted)}
.i-blue{background:#3c8dbc} .i-orange{background:#d9822b} .i-green{background:#2f9e62} .i-slate{background:#5d7380} .i-teal{background:#1f8f93} .i-plum{background:#7b5ea7}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:10px 14px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .cur{fill:var(--fg);font-weight:700}
.chart line{stroke:var(--line)}
.chart .b-rev{fill:var(--c-rev)} .chart .b-exp{fill:var(--c-exp)}
.alerts{list-style:none;margin:0;padding:10px 14px 14px;display:grid;gap:8px}
.alerts li{padding:8px 10px;border-radius:3px;background:var(--neutral-bg);font-size:13px}
.alerts li.warn{background:var(--warn-bg);color:var(--warn)} .alerts li.bad{background:var(--bad-bg);color:var(--bad)} .alerts li.good{background:var(--good-bg);color:var(--good)}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--neutral-bg);overflow:hidden;margin:8px 0}
.bar span{display:block;height:100%;background:var(--good)}

.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px}
.guide .g{background:var(--card);border-radius:3px;box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.guide .g b{display:block;font-size:12px;letter-spacing:.05em;color:var(--accent);margin-bottom:4px}
.guide .g p{margin:0;max-width:70ch}

/* form modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);color:var(--fg);border-radius:6px;max-width:560px;width:100%;padding:20px;display:grid;gap:12px;max-height:92vh;overflow:auto}
.modal.wide .box{max-width:820px}
.modal h3{margin:0;font-size:18px}
.modal p{margin:0;font-size:13.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (max-width:640px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.ff{display:grid;gap:4px;min-width:0}
.ff.full{grid-column:1/-1}
.ff label{font-size:13.5px;font-weight:600}
.ff .fi{height:46px;font-size:16px;border:1px solid var(--input-line);background:var(--in-bg);border-radius:5px;padding:0 12px;width:100%;min-width:0}
.ff .fi.num{text-align:right;font-variant-numeric:tabular-nums}
.ff .fi[disabled]{opacity:.75}
.ff .ferr{font-size:12.5px;color:var(--bad);min-height:0}
.ff.bad .fi{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.chk{display:flex;align-items:center;gap:10px;min-height:46px;font-size:15px}
.fsum{background:var(--calc-bg);border-radius:5px;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fsum div{font-size:12.5px;color:var(--muted)}
.fsum b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal .btn{min-height:46px;font-size:15px}
.modal hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
.lockmark{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--warn)}

.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px}
.login .box{background:var(--card);border-top:3px solid var(--accent);border-radius:4px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:26px;display:grid;gap:14px}
.login .mk{width:46px;height:46px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.login h1{margin:0;font-size:19px}.login p{margin:0;font-size:13.5px;color:var(--muted)}
.login label{display:grid;gap:5px;font-size:14px;font-weight:600}
.login input{height:46px;font-size:16px;border:1px solid var(--input-line);background:var(--in-bg);border-radius:5px;padding:0 12px;width:100%;min-width:0}
.login .btn{min-height:48px;font-size:16px}
.lerr{color:var(--bad);font-size:13px;min-height:1.2em}

.scrim{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#22323a;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;z-index:80;max-width:90vw}
@media (max-width:899px){
  .brand{width:auto;background:none;padding-left:max(8px,env(safe-area-inset-left,0px))}
  .brand span.t{display:none}
  .side{position:fixed;left:0;bottom:0;z-index:30;margin-left:-240px;box-shadow:2px 0 12px rgba(0,0,0,.3);top:calc(54px + env(safe-area-inset-top,0px))}
  .collapsed .side{margin-left:-240px}
  .open-nav .side{margin-left:0}
  .open-nav .scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35)}
  .tbtn .lb,.mon .lb{display:none}
}
@media (max-width:520px){#bk,#rs,.gsst{display:none}.mon input{width:132px;padding:4px 6px}.tbtn{padding:0 9px}.top{gap:4px}.brand .mk{width:28px;height:28px}.iconbtn{width:38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="mk">KV</div><span class="t">KHÁT VỌNG</span></div>
    <button class="iconbtn" id="burger" aria-label="Mở hoặc đóng menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="grow"></div>
    <label class="mon"><span class="lb">Tháng báo cáo</span><input type="month" id="month" aria-label="Tháng báo cáo"></label>
    <button class="tbtn" id="acct" title="Tài khoản"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span class="lb" id="acctname">Tài khoản</span><span class="gsst" id="gsst">Cục bộ</span></button>
    <button class="tbtn" id="xl" title="Xuất Excel"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg><span class="lb">Xuất Excel</span></button>
    <button class="tbtn" id="bk" title="Sao lưu JSON"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg><span class="lb">Sao lưu</span></button>

function depMonth(a,m){
  if(!a.ngaysd||!N(a.nguyengia)||!N(a.thkh))return 0;
  const s=mIdx(a.ngaysd),k=mIdx(m)-s;
  if(k<0||k>=N(a.thkh))return 0;
  if(a.ngayngung&&mIdx(m)>mIdx(a.ngayngung))return 0;
  return N(a.nguyengia)/N(a.thkh);
}
function depRange(a,from,to){let t=0;for(let i=mIdx(from);i<=mIdx(to);i++){const m=Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0');t+=depMonth(a,m)}return t}
function depAccum(a,m){return a.ngaysd?depRange(a,a.ngaysd.slice(0,7),m):0}
/* kết quả kinh doanh */
function pnlRange(from,to){
  const inR=d=>!!d&&d>=from+'-01'&&d<nm(to)+'-01';
  const dt=sum(S.doanhthu.filter(r=>inR(r.ngay)),r=>r.dt);
  const gv=sum(S.chiphi.filter(r=>inR(r.ngay)&&r.nhom==='Giá vốn'),r=>r.cp);
  const vh=sum(S.chiphi.filter(r=>inR(r.ngay)&&r.nhom!=='Giá vốn'),r=>r.cp);
  const kh=sum(S.taisan,a=>depRange(a,from,to));
  const tt=sum(S.chiphi.filter(r=>inR(r.ngay)&&r.quy),r=>r.cp);
  const lng=dt-gv,lkd=lng-vh-kh,lntt=lkd+tt;
  return {dt,gv,lng,vh,kh,lkd,tt,lntt,margin:dt?lng/dt:0};
}
function pnl(m){
  const a=pnlRange(m,m),y=pnlRange(m.slice(0,4)+'-01',m),tax=S.settings.tax||{};
  a.tax=N(tax[m]);y.tax=Object.keys(tax).filter(k=>k.slice(0,4)===m.slice(0,4)&&k<=m).reduce((t,k)=>t+N(tax[k]),0);
  a.lnst=a.lntt-a.tax;y.lnst=y.lntt-y.tax;return {m:a,y};
}
function pnlYear(y){const r=pnlRange(y+'-01',y+'-12'),tax=S.settings.tax||{};r.tax=Object.keys(tax).filter(k=>k.slice(0,4)===String(y)).reduce((t,k)=>t+N(tax[k]),0);r.lnst=r.lntt-r.tax;return r}

function shareholders(){
  const map=new Map();
  S.von.slice().sort((a,b)=>(a.ngay||'').localeCompare(b.ngay||'')).forEach(r=>{
    if(!r.ma)return;if(!map.has(r.ma))map.set(r.ma,{ma:r.ma,ten:r.ten,cp:0,dk:0,ml:0,mg:N(r.menhgia)||10000,first:''});
    const o=map.get(r.ma),sg=VON_TYPES[r.loaigd]||0,n=N(r.socp);if(r.ten)o.ten=r.ten;if(N(r.menhgia))o.mg=N(r.menhgia);
    o.cp+=sg*n;if(r.loaigd==='Đăng ký mua cổ phần'){o.dk+=n;if(!o.first)o.first=r.ngay}if(r.loaigd==='Công ty mua lại')o.ml+=n;
  });
  const list=Array.from(map.values()),tot=list.reduce((a,b)=>a+b.cp,0);
  list.forEach(o=>{o.share=tot?o.cp/tot:0;o.vonmg=o.cp*o.mg;o.phaigop=(o.dk)*o.mg;o.dagop=paid('cd:'+o.ma,'Thu');o.hoan=paid('cd:'+o.ma,'Chi');o.congop=Math.max(0,o.phaigop-o.dagop);
    o.over90=o.congop>0&&o.first&&days(o.first,today())>90});
  return {list,tot,vdl:list.reduce((a,o)=>a+o.vonmg,0),dagop:list.reduce((a,o)=>a+o.dagop-o.hoan,0)};
}

  if(ME.role==='nhanvien')return STAFF_PAGES.indexOf(id)>=0;

/* =========================================================
   7. LƯU: CỤC BỘ HOẶC GOOGLE SHEET (theo dòng, có phiên bản)
   ========================================================= */
let saveT=0,flushT=0,flushing=false;
const Q=new Map();
function persistLocal(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200)}
function logLocal(action,tab,label,detail){if(ONLINE)return;S.log.unshift({time:new Date().toISOString(),user:ME.name,action,tab,id:label,detail});if(S.log.length>500)S.log.length=500}
function diffText(a,b){if(!a)return '';const ks=Object.keys(b).filter(k=>k[0]!=='_'&&k!=='id'&&String(a[k]==null?'':a[k])!==String(b[k]==null?'':b[k]));return ks.map(k=>k+': '+(a[k]===''||a[k]==null?'∅':a[k])+' → '+(b[k]===''||b[k]==null?'∅':b[k])).join('; ')}
const rowLabel=(tab,r)=>r.so||r.ma||r.ten||r.id;
function upsertRow(tab,row,orig){
  const arr=S[tab],i=arr.findIndex(r=>r.id===row.id);
  if(!ONLINE){row._ub=ME.name;row._ua=new Date().toISOString();if(i<0)row._cb=ME.u}
  else if(i<0)row._cb=ME.u;
  if(i<0)arr.push(row);else arr[i]=row;
  logLocal(i<0?'Thêm':'Sửa',tab,rowLabel(tab,row),i<0?'':diffText(orig,row));
  queue(tab,'upsert',row,orig?orig._ver:'');
}
function deleteRow(tab,id){
  const r=S[tab].find(x=>x.id===id);if(!r)return;
  S[tab]=S[tab].filter(x=>x.id!==id);
  if(tab==='thuchi')S.saoke.forEach(l=>{if(l.khop===id){l.khop='';queue('saoke','upsert',l,l._ver)}});
  logLocal('Xóa',tab,rowLabel(tab,r),'');
  queue(tab,'delete',r,r._ver);
}
function queue(tab,op,row,base){
  if(!ONLINE){persistLocal();return}
  const k=tab+':'+row.id,prev=Q.get(k);
  Q.set(k,{tab,op,id:row.id,row:op==='delete'?null:Object.assign({},row),base:prev?prev.base:(base||'')});
  setStatus('Chờ lưu…','');clearTimeout(flushT);flushT=setTimeout(flush,700);
}
async function flush(){
  if(flushing){clearTimeout(flushT);flushT=setTimeout(flush,400);return}
  if(!Q.size)return;flushing=true;
  const ops=Array.from(Q.values());Q.clear();setStatus('Đang lưu…','');
  let resync=false;
  try{
    const j=await api('save',{ops});
    (j.results||[]).forEach(res=>{
      if(res.ok&&res.row){const arr=S[res.tab],i=arr.findIndex(r=>r.id===res.id),nr=conv(res.tab,res.row);if(i>=0)arr[i]=nr;else arr.push(nr);
        Q.forEach(q=>{if(q.tab===res.tab&&q.id===res.id)q.base=nr._ver})}
      if(!res.ok){resync=true;toast(res.error||'Không lưu được một dòng.')}
    });
    setStatus(resync?'Có lỗi':'Đã lưu',resync?'err':'ok');
  }catch(e){
    if(e.code==='auth'){flushing=false;doLogout('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.');return}
    ops.forEach(o=>{const k=o.tab+':'+o.id;if(!Q.has(k))Q.set(k,o)});
    setStatus('Lỗi lưu','err');toast('Chưa lưu được lên Google Sheet, sẽ thử lại: '+(e.message||'mất kết nối'));
    clearTimeout(flushT);flushT=setTimeout(flush,8000);
  }
  flushing=false;
  if(resync){await pull();}
  buildIndex();rerender();
}
function setSetting(key,val){
  S.settings[key]=val;logLocal('Thiết lập',key,'',typeof val==='object'?'':String(val));
  if(!ONLINE){persistLocal();return}
  const patch={};patch[key]=val;
  api('settings',{patch}).then(()=>setStatus('Đã lưu','ok')).catch(e=>{toast(e.message||'Không lưu được thiết lập.');pull().then(rerender)});
}
async function api(action,extra){
  const body=JSON.stringify(Object.assign({action,token:TOKEN},extra||{}));
  const r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  const j=await r.json();
  if(!j.ok){const e=new Error(j.error||'Lỗi không rõ');e.code=j.code;throw e}
  return j;
}
function conv(tab,row){
  const o=Object.assign({},row);if(!o.id)o.id=uid();
  (TABDEF[tab].num||[]).forEach(k=>{if(o[k]!==''&&o[k]!=null)o[k]=Number(o[k])});
  if(tab==='thuchi')o.doichieu=o.doichieu===true||o.doichieu==='true'||o.doichieu==='TRUE'||o.doichieu===1||o.doichieu==='1';
  ['_ver'].forEach(k=>{if(o[k]!=null)o[k]=String(o[k])});
  return o;
}
async function pull(){
  if(!ONLINE)return false;setStatus('Đang tải…','');
  try{
    const j=await api('load');ME=j.user;
    const d=j.data||{};S=blank();S.month=$('#month').value||S.month;
    TABS.forEach(t=>{S[t]=(d[t]||[]).map(r=>conv(t,r))});
    S.settings=Object.assign(S.settings,j.settings||{});
    normalize();buildIndex();setStatus(ROLES[ME.role],'ok');return true;
  }catch(e){
    if(e.code==='auth'){doLogout('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.');return false}
    setStatus('Lỗi kết nối','err');toast('Không đọc được Google Sheet: '+(e.message||'mất kết nối'));return false;
  }
}

  });

function validate(tab,v){
  const e={},p=PAGES[FORM.id],def=TABDEF[tab],id=FORM.rowId;
  def.req.forEach(k=>{if(v[k]===''||v[k]==null)e[k]='Bắt buộc nhập.'});
  (def.num||[]).forEach(k=>{if(v[k]!==''&&v[k]!=null&&N(v[k])<0)e[k]='Không được âm.'});
  (def.int||[]).forEach(k=>{if(v[k]!==''&&v[k]!=null&&!Number.isInteger(N(v[k])))e[k]='Phải là số nguyên.'});
  p.cols.forEach(c=>{if(c.t==='date'&&v[c.k]&&!/^\d{4}-\d{2}-\d{2}$/.test(v[c.k]))e[c.k]='Ngày không hợp lệ.'});
  if(def.date&&v[def.date]&&isLockedDate(v[def.date])&&ME.role!=='admin')e[def.date]='Tháng này đã khóa sổ.';
  const others=S[tab].filter(r=>r.id!==id);
  if(tab==='doanhthu'&&v.so&&others.some(r=>r.so===v.so))e.so='Số hóa đơn đã tồn tại.';
  if(tab==='thuchi'&&v.so&&others.some(r=>r.so===v.so))e.so='Số phiếu đã tồn tại.';
  if(tab==='chiphi'&&v.so&&others.some(r=>r.so===v.so&&r.ncc===v.ncc))e.so='Chứng từ này của nhà cung cấp đã được nhập.';
  if(['dm','taikhoan','taitro'].indexOf(tab)>=0&&v.ma&&others.some(r=>r.ma===v.ma))e.ma='Mã đã tồn tại.';
  if(tab==='duan'&&v.ten&&others.some(r=>r.ten===v.ten))e.ten='Dự án đã có dòng.';
  if(tab==='congno'&&v.so&&others.some(r=>r.so===v.so))e.so='Số chứng từ đã tồn tại.';
  if(tab==='thuchi'){
    if(v.loai&&v.danhmuc&&(CASH_CATS[v.loai]||[]).indexOf(v.danhmuc)<0)e.danhmuc='Danh mục không khớp loại Thu/Chi.';
    if(CAT_LINK[v.danhmuc]&&!v.lienket)e.lienket='Chọn chứng từ để công nợ tự cập nhật.';
    if(v.lienket&&N(v.sotien)>0){const o=linkOpts(v.danhmuc,v.lienket).find(x=>x.v===v.lienket);
      if(o&&o.rem!=null){const room=o.rem+(FORM.orig&&FORM.orig.lienket===v.lienket?N(FORM.orig.sotien):0);if(N(v.sotien)>room)e.sotien='Vượt số còn lại của chứng từ ('+fmt(room)+').'}}
    if(v.sotien!==''&&N(v.sotien)===0)e.sotien='Số tiền phải lớn hơn 0.';
  }
  if(tab==='von'){if(v.menhgia!==''&&N(v.menhgia)<=0)e.menhgia='Mệnh giá phải lớn hơn 0.';
    if((VON_TYPES[v.loaigd]||0)<0&&v.ma){const sh=shareholders().list.find(o=>o.ma===v.ma);const own=(sh?sh.cp:0)+(FORM.orig&&FORM.orig.ma===v.ma?-(VON_TYPES[FORM.orig.loaigd]||0)*N(FORM.orig.socp):0);if(N(v.socp)>own)e.socp='Vượt số cổ phần đang sở hữu ('+fmt(own)+').'}}
  if(tab==='taisan'&&v.thkh!==''&&N(v.thkh)<=0)e.thkh='Phải lớn hơn 0.';
  if(tab==='phanphoi'&&v.nam&&(N(v.nam)<2000||N(v.nam)>2100))e.nam='Năm không hợp lệ.';
  if(['doanhthu','chiphi','congno','phanphoi','taitro'].indexOf(tab)>=0){const k={doanhthu:'dt',chiphi:'cp',congno:'sotien',phanphoi:'sotien',taitro:'giatri'}[tab];if(v[k]!==''&&N(v[k])===0)e[k]='Phải lớn hơn 0.'}
  return e;
}
function saveForm(again){

  const row=Object.assign({},FORM.orig||{},v,{id:FORM.rowId||uid()});
  upsertRow(FORM.tab,row,FORM.orig);
  toast(FORM.rowId?'Đã lưu thay đổi.':'Đã thêm.');
  const id=FORM.id;buildIndex();
  if(again){const keep={};['ngay','linhvuc','duan','taikhoan','loai','danhmuc','nhom','ts'].forEach(k=>{if(v[k]!=null)keep[k]=v[k]});keep.lienket='';closeForm();rerender();openForm(id,'',keep)}

}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p,s=n<=1?1:n<=2?2:n<=5?5:10;return s*p}
const short=v=>v>=1e9?+(v/1e9).toFixed(1)+' tỷ':v>=1e6?+(v/1e6).toFixed(1)+' tr':v>=1e3?+(v/1e3).toFixed(0)+' k':String(Math.round(v));
function chartSVG(m){
  const ms=[-5,-4,-3,-2,-1,0].map(i=>pm(m,i)),data=ms.map(k=>{const p=pnlRange(k,k);return {k,rev:p.dt,exp:p.gv+p.vh+p.kh}});
  const mx=Math.max.apply(null,data.reduce((a,d)=>a.concat([d.rev,d.exp]),[]));
  const max=mx>0?niceMax(mx):1e6,W=620,H=250,L=52,R=10,T=14,B=30,iw=W-L-R,ih=H-T-B,y=v=>T+ih-(v/max)*ih,gw=iw/6,bw=gw*.27;
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+short(v)+'</text>'}
  data.forEach((d,i)=>{const cx=L+gw*i+gw/2,hr=ih*d.rev/max,he=ih*d.exp/max,lab='T'+d.k.slice(5)+'/'+d.k.slice(2,4);
    g+='<rect class="b-rev" x="'+(cx-bw-2)+'" y="'+(T+ih-hr)+'" width="'+bw+'" height="'+hr+'" rx="2"><title>'+lab+' – Doanh thu: '+fmt(d.rev)+'</title></rect><rect class="b-exp" x="'+(cx+2)+'" y="'+(T+ih-he)+'" width="'+bw+'" height="'+he+'" rx="2"><title>'+lab+' – Chi phí: '+fmt(d.exp)+'</title></rect><text class="'+(i===5?'cur':'')+'" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+lab+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Doanh thu và chi phí 6 tháng gần nhất">'+g+'</svg>';
}

function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'',delim=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===delim){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
const plain=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
function parseDate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return ''}
function parseAmt(s){s=String(s||'').trim();if(!s)return 0;const neg=/^-|^\(.*\)$/.test(s);const v=Number(s.replace(/[^\d]/g,''))||0;return neg?-v:v}
function importStatement(text){
  const rows=parseCSV(text);if(rows.length<2){toast('Tệp không có dữ liệu.');return}
  let hi=rows.findIndex(r=>r.some(c=>/ngay|date/.test(plain(c))));if(hi<0)hi=0;
  const h=rows[hi].map(plain),find=re=>h.findIndex(c=>re.test(c));
  const iD=find(/ngay giao dich|ngay|date/),iM=find(/mo ta|dien giai|noi dung|description|remark/),iA=find(/^so tien|amount/),iDr=find(/ghi no|debit|rut|tien ra/),iCr=find(/ghi co|credit|gui|tien vao/);
  if(iD<0||(iA<0&&iDr<0&&iCr<0)){toast('Không tìm thấy cột ngày hoặc số tiền trong tệp.');return}
  const acc=UI.recon.acc;let n=0,skip=0;
  rows.slice(hi+1).forEach(r=>{
    const ngay=parseDate(r[iD]);if(!ngay)return;
    const amt=iA>=0?parseAmt(r[iA]):(iCr>=0?Math.abs(parseAmt(r[iCr])):0)-(iDr>=0?Math.abs(parseAmt(r[iDr])):0);if(!amt)return;
    const mota=iM>=0?String(r[iM]).trim():'';
    if(S.saoke.some(l=>l.taikhoan===acc&&l.ngay===ngay&&N(l.sotien)===amt&&l.mota===mota)){skip++;return}
    upsertRow('saoke',{id:uid(),taikhoan:acc,ngay,mota,sotien:amt,khop:''},null);n++;
  });
  buildIndex();toast('Đã nạp '+n+' dòng sao kê'+(skip?', bỏ qua '+skip+' dòng trùng':'')+'.');rerender();
}

  if(!ONLINE)return '<div class="card"><div class="pad">Quản lý người dùng chỉ có khi đã nối Google Sheet (điền apiUrl trong config.json). Ở chế độ cục bộ, mọi thao tác chạy với quyền Admin.</div></div>';
  return '<div class="card"><div class="tools"><button class="btn primary push" id="uadd">+ Thêm người dùng</button></div><div class="tw"><table class="tbl"><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Tác vụ</th></tr></thead><tbody id="utb"><tr><td colspan="5" class="empty">Đang tải…</td></tr></tbody></table></div></div>';
}
async function loadUsers(){
  if(!ONLINE)return;
  try{const j=await api('users');USERS=j.users||[]}catch(e){USERS=[];toast(e.message||'Không tải được danh sách.')}
  const tb=$('#utb');if(!tb)return;
  tb.innerHTML=USERS.map(u=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.name)+'</td><td>'+esc(ROLES[u.role]||u.role)+'</td><td>'+(u.active?'<span class="pill good">Đang hoạt động</span>':'<span class="pill">Đã khóa</span>')+'</td><td><button class="btn sm uedit" data-u="'+esc(u.username)+'">Sửa</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">Chưa có người dùng.</td></tr>';
}
function openUser(u){
  const isNew=!u;u=u||{username:'',name:'',role:'nhanvien',active:true};
  $('#ambox').innerHTML='<h3 id="amh">'+(isNew?'Thêm người dùng':'Sửa người dùng')+'</h3><div class="fgrid">'+
   '<div class="ff"><label for="u-name">Họ tên *</label><input class="fi" id="u-name" value="'+esc(u.name)+'"></div>'+
   '<div class="ff"><label for="u-user">Tên đăng nhập *</label><input class="fi" id="u-user" value="'+esc(u.username)+'"'+(isNew?'':' disabled')+' autocomplete="off"></div>'+
   '<div class="ff"><label for="u-role">Vai trò</label><select class="fi" id="u-role">'+Object.keys(ROLES).map(r=>'<option value="'+r+'"'+(u.role===r?' selected':'')+'>'+ROLES[r]+'</option>').join('')+'</select></div>'+
   '<div class="ff"><label for="u-pass">'+(isNew?'Mật khẩu *':'Đặt lại mật khẩu')+'</label><input class="fi" id="u-pass" type="password" autocomplete="new-password" placeholder="'+(isNew?'Tối thiểu 8 ký tự':'Để trống nếu giữ nguyên')+'"></div>'+
   '<div class="ff full"><label class="chk"><input type="checkbox" id="u-act"'+(u.active?' checked':'')+'> Cho phép đăng nhập</label></div></div>'+
   '<div class="row"><button class="btn primary" id="usave" data-new="'+(isNew?1:0)+'">Lưu</button><button class="btn" id="amclose">Hủy</button></div>';
  $('#am').hidden=false;$('#u-name').focus();
}
async function saveUser(isNew){
  const user={username:$('#u-user').value.trim(),name:$('#u-name').value.trim(),role:$('#u-role').value,active:$('#u-act').checked,password:$('#u-pass').value};
  if(!user.username||!user.name){toast('Nhập họ tên và tên đăng nhập.');return}
  if(!/^[a-z0-9._-]{3,30}$/i.test(user.username)){toast('Tên đăng nhập 3–30 ký tự, chỉ chữ không dấu, số, dấu chấm, gạch.');return}
  if((isNew||user.password)&&user.password.length<8){toast('Mật khẩu tối thiểu 8 ký tự.');return}
  try{await api('userSave',{user,isNew});$('#am').hidden=true;toast('Đã lưu người dùng.');loadUsers()}catch(e){toast(e.message||'Không lưu được.')}
}

const app=$('#app'),main=$('#main');
$('#side').addEventListener('click',e=>{const b=e.target.closest('.grp>button');if(!b)return;const g=b.parentNode.dataset.g;openG[g]=!openG[g];b.parentNode.classList.toggle('open',openG[g]);b.setAttribute('aria-expanded',!!openG[g])});
$('#burger').addEventListener('click',()=>{if(window.matchMedia('(max-width:899px)').matches)app.classList.toggle('open-nav');else app.classList.toggle('collapsed')});

$('#month').addEventListener('change',e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){S.month=e.target.value;if(!ONLINE)persistLocal();rerender()}});

main.addEventListener('change',e=>{
  const t=e.target,p=PAGES[PAGE];
  if(t.dataset.rin){
    const raw=t.dataset.rin==='rate'?N(t.value):Number(String(t.value).replace(/[^\d]/g,''))||0;
    if(t.dataset.rin==='tax'){const tx=Object.assign({},S.settings.tax);tx[S.month]=raw;setSetting('tax',tx)}
    else if(t.dataset.rin==='rate')setSetting('rate',Math.min(1,Math.max(0,raw/100)));
    else if(t.dataset.rin==='budget'){const b=Object.assign({},S.settings.budget);b[t.dataset.k]=raw;setSetting('budget',b)}
    else if(t.dataset.rin==='stmt'){const s=Object.assign({},S.settings.stmt);s[t.dataset.k]=t.value.trim()===''?'':(t.value.trim().startsWith('-')?-raw:raw);setSetting('stmt',s)}
    rerender();return}
  if(t.id==='ff'){UI[PAGE].f=t.value;UI[PAGE].page=0;fillRows(PAGE);return}
  if(t.id==='fmo'){UI[PAGE].mo=t.value;UI[PAGE].page=0;fillRows(PAGE);return}
  if(t.id==='act'){updBulk();return}
  if(t.id==='all'){$$('.rk:not([disabled])').forEach(x=>x.checked=t.checked);updBulk();return}
  if(t.classList.contains('rk')){updBulk();return}
  if(t.id==='racc'){UI.recon.acc=t.value;rerender();return}
  if(t.id==='rfile'){const f=t.files&&t.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>importStatement(String(fr.result));fr.readAsText(f,'utf-8');t.value='';return}
  if(t.id==='lockto'){UI.lockTo=t.value;rerender();return}
});
main.addEventListener('input',e=>{
  if(e.target.id==='q'){UI[PAGE].q=e.target.value;UI[PAGE].page=0;fillRows(PAGE)}
  if(e.target.id==='lq')fillLog();
});
main.addEventListener('click',e=>{
  const t=e.target,p=PAGES[PAGE];
  if(t.closest('#clearSample')){S=blank();S.month='2026-11';persistLocal();rerender();toast('Đã xóa dữ liệu mẫu.');return}
  if(t.closest('#add')){openForm(PAGE,'');return}
  if(t.closest('#pprev')){UI[PAGE].page--;fillRows(PAGE);return}
  if(t.closest('#pnext')){UI[PAGE].page++;fillRows(PAGE);return}
  if(t.closest('#bdel')){const ids=$$('.rk:checked').map(x=>x.closest('tr').dataset.id);ids.forEach(id=>deleteRow(p.tab,id));$('#act').value='';buildIndex();rerender();toast('Đã xóa '+ids.length+' dòng.');return}
  if(t.closest('#bcancel')){$$('.rk').forEach(x=>x.checked=false);$('#act').value='';updBulk();return}
  const dl=t.closest('.ib.del');
  if(dl){e.stopPropagation();
    if(dl.dataset.arm){deleteRow(p.tab,dl.closest('tr').dataset.id);buildIndex();rerender();toast('Đã xóa.');return}
    dl.dataset.arm='1';dl.classList.add('armed');dl.textContent='Xóa?';
    setTimeout(()=>{if(dl.isConnected){delete dl.dataset.arm;dl.classList.remove('armed');dl.innerHTML=ic('x')}},3000);return}
  if(t.closest('.ck'))return;
  const tr=t.closest('tr.rw');if(tr&&p.kind==='input'){openForm(PAGE,tr.dataset.id);return}
  if(t.closest('#rimp')){$('#rfile').click();return}
  if(t.closest('#rauto')){autoMatch();return}
  const lr=t.closest('tr[data-l]');
  if(lr){const lid=lr.dataset.l;
    if(t.closest('.rdo')){const sel=lr.querySelector('.rmatch');if(sel){setMatch(lid,sel.value);rerender();toast('Đã khớp.')}return}
    if(t.closest('.runmatch')){setMatch(lid,'');rerender();return}
    if(t.closest('.rnew')){const l=S.saoke.find(x=>x.id===lid);const amt=N(l.sotien);
      const preset={ngay:l.ngay,loai:amt<0?'Chi':'Thu',danhmuc:amt<0?'Chi khác':'Thu khác',taikhoan:l.taikhoan,sotien:Math.abs(amt),diengiai:l.mota,so:'SK'+l.ngay.replace(/-/g,'').slice(2)+'-'+lid.slice(-3).toUpperCase(),doichieu:true};
      PAGE_RETURN={line:lid};openForm('thu-chi','',preset);return}}
  if(t.closest('#dolock')){const v=$('#lockto').value;if(!/^\d{4}-\d{2}$/.test(v))return;setSetting('lockedThrough',v);rerender();toast('Đã khóa sổ đến hết tháng '+v.slice(5)+'/'+v.slice(0,4)+'.');return}
  if(t.closest('#unlock')){setSetting('lockedThrough','');rerender();toast('Đã mở khóa sổ.');return}
  if(t.closest('#uadd')){openUser(null);return}
  const ue=t.closest('.uedit');if(ue){openUser((USERS||[]).find(u=>u.username===ue.dataset.u));return}
});

async function changePass(){
  const o=$('#cp-old').value,n=$('#cp-new').value;
  if(n.length<8){toast('Mật khẩu mới tối thiểu 8 ký tự.');return}
  try{await api('changePass',{old:o,new:n});$('#am').hidden=true;toast('Đã đổi mật khẩu.')}catch(e){toast(e.message||'Không đổi được mật khẩu.')}
}

/* xuất Excel, sao lưu */
async function saveFile(name,data,mime){
  try{
    if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data});toast('Đã lưu '+name);return}}
    const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  }catch(err){if(err&&err.code==='declined')return;toast('Không lưu được tệp.')}
}
function buildWB(){
  const wb=XLSX.utils.book_new(),m=S.month;
  GROUPS.forEach(g=>g.items.forEach(id=>{
    const p=PAGES[id];if(!canPage(id)||!p.xl)return;let aoa=[];
    if(p.kind==='input'){const cols=p.cols;aoa=[cols.map(c=>c.l).concat(['Người tạo','Người sửa','Thời gian sửa'])].concat(S[p.tab].map(r=>cols.map(c=>{
      if(c.t==='calc')return c.f(r);if(c.t==='badge')return c.f(r)[0];if(c.tbl)return c.tbl(r);if(c.t==='check')return r[c.k]?'x':'';return r[c.k]==null?'':r[c.k]}).concat([r._cb||'',r._ub||'',r._ua||''])))}
    else if(p.kind==='report'){REPORTS[id](m).forEach((t,i)=>{if(i)aoa.push([]);if(t.title)aoa.push([t.title]);aoa.push(t.head);t.rows.forEach(r=>aoa.push(r.c.map(rawCell)));if(t.foot)aoa.push(t.foot.map(rawCell))})}
    else if(p.kind==='dash'){const k=kpis(m);aoa=[['Chỉ tiêu','Giá trị'],['Tháng báo cáo',m],['Doanh thu tháng',k.p.m.dt],['Lợi nhuận sau thuế tháng',k.p.m.lnst],['Lợi nhuận sau thuế lũy kế năm',k.p.y.lnst],['Biên lợi nhuận gộp tháng',pct(k.p.m.margin)],['Tiền cuối tháng',k.tot],['Tiền tài trợ chưa dùng',k.rs],['Tiền tự do',k.free],['Số tháng đủ chi',k.runway==null?'':+k.runway.toFixed(1)],['Phải thu',k.rec],['Phải thu quá hạn',k.recOd],['Phải trả',k.pay],['Phải trả quá hạn',k.payOd],['DSO (ngày)',k.dso==null?'':k.dso],['Vốn điều lệ',k.sh.vdl],['Vốn đã góp',k.sh.dagop],['Tái đầu tư 51% còn thiếu',k.r51.gap],['Người hưởng lợi',k.ppl],['Việc làm tạo ra',k.jobs]]}
    else aoa=[['Xem phần Hướng dẫn trên web.']];
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=(aoa[0]||[]).map(()=>({wch:20}));XLSX.utils.book_append_sheet(wb,ws,p.xl.slice(0,31));
  }));
  return wb;
}
$('#xl').addEventListener('click',()=>{
  if(!window.XLSX){toast('Chưa tải được thư viện Excel.');return}
  try{const buf=XLSX.write(buildWB(),{type:'array',bookType:'xlsx'});saveFile('Quan-tri-tai-chinh-Khat-Vong-'+S.month+'.xlsx',buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}catch(e){console.error(e);toast('Không tạo được tệp Excel.')}
});
$('#bk').addEventListener('click',()=>saveFile('khat-vong-tai-chinh-sao-luu.json',JSON.stringify(S,null,1),'application/json'));
$('#rs').addEventListener('click',()=>$('#restore').click());
$('#restore').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.doanhthu)||!o.settings)throw 0;S=o;normalize();persistLocal();$('#month').value=S.month;rerender();toast('Đã khôi phục dữ liệu.')}catch(x){toast('Tệp không đúng định dạng sao lưu của phiên bản này.')}};
  fr.readAsText(f);e.target.value='';
});

/* đăng nhập */
function showLogin(msg){app.hidden=true;$('#login').hidden=false;$('#lerr').textContent=msg||'';setTimeout(()=>$('#luser').focus(),50)}
function doLogout(msg){
  if(TOKEN)api('logout').catch(()=>{});
  try{sessionStorage.removeItem(SESSKEY)}catch(e){}
  TOKEN='';Q.clear();clearTimeout(flushT);ME={u:'',name:'',role:''};S=blank();$('#am').hidden=true;closeForm();showLogin(msg||'');
}
function applyRoleUI(){
  $('#xl').hidden=ME.role==='nhanvien';$('#bk').hidden=ONLINE;$('#rs').hidden=ONLINE;
  $('#acctname').textContent=ONLINE?ME.name:'Tài khoản';setStatus(ONLINE?ROLES[ME.role]:'Cục bộ',ONLINE?'ok':'');
}
async function enter(){
  $('#login').hidden=true;app.hidden=false;applyRoleUI();$('#month').value=S.month;
  if(ONLINE&&ME.role==='admin'&&!S.dm.length&&!S.taikhoan.length){
    const b=blank();b.dm.forEach(r=>upsertRow('dm',r,null));b.taikhoan.forEach(r=>upsertRow('taikhoan',r,null));
    toast('Lần chạy đầu: đã tạo danh mục và tài khoản tiền mặc định.');
  }
  go(location.hash.slice(1));
}
$('#lf').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#lbtn');b.disabled=true;$('#lerr').textContent='';
  try{
    const r=await fetch(CONFIG.apiUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',username:$('#luser').value.trim(),password:$('#lpass').value})});
    const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.error||'Đăng nhập không thành công'),{code:j.code});
    TOKEN=j.token;try{sessionStorage.setItem(SESSKEY,TOKEN)}catch(x){}
    $('#lpass').value='';if(await pull())enter();
  }catch(err){$('#lerr').textContent=err.message&&err.code?err.message:'Không kết nối được máy chủ dữ liệu.'}
  finally{b.disabled=false}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ONLINE&&TOKEN&&!Q.size&&!FORM)pull().then(ok=>{if(ok)rerender()})});
window.addEventListener('beforeunload',e=>{if(Q.size){e.preventDefault();e.returnValue=''}});

/* =========================================================
   16. KHỞI ĐỘNG
   ========================================================= */
(async function boot(){
  try{const r=await fetch('config.json',{cache:'no-store'});if(r.ok){const c=await r.json();if(c&&typeof c==='object')CONFIG=Object.assign(CONFIG,c)}}catch(e){}
  if(window.matchMedia('(max-width:899px)').matches)app.classList.add('collapsed');
  if(CONFIG.apiUrl){
    ONLINE=true;S=blank();ME={u:'',name:'',role:''};
    try{TOKEN=sessionStorage.getItem(SESSKEY)||''}catch(e){}
    if(TOKEN&&await pull()){enter();return}
    TOKEN='';showLogin();
  }else{
    ONLINE=false;S=loadLocal()||seed();normalize();ME={u:'cucbo',name:'Chế độ cục bộ',role:'admin'};enter();
  }
})();
})();
</script>
